name: Build Windows exe

on:
  push:
    branches: [main]
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Read package version
        id: package-version
        shell: pwsh
        env:
          GITHUB_REF_TYPE: ${{ github.ref_type }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: |
          $package = Get-Content package.json -Raw | ConvertFrom-Json
          "value=$($package.version)" >> $env:GITHUB_OUTPUT
          if ($env:GITHUB_REF_TYPE -eq "tag") {
            $tagVersion = $env:GITHUB_REF_NAME.TrimStart('v')
            if ($package.version -ne $tagVersion) {
              throw "Git tag $tagVersion does not match package.json version $($package.version)"
            }
          }

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Check application syntax
        run: node --check src/app.js

      - name: Run tests
        run: npm test

      - name: Build installer and update metadata
        run: npm run dist

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: Speekly-setup
          path: |
            dist/*.exe
            dist/latest.yml
            dist/*.blockmap
          if-no-files-found: error
          retention-days: 7

      - name: Publish automatic updates to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.package-version.outputs.value }}
          target_commitish: ${{ github.sha }}
          files: |
            dist/*.exe
            dist/latest.yml
            dist/*.blockmap
          fail_on_unmatched_files: true
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
